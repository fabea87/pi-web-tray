name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags are needed to compute the next release version

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          $event = "${{ github.event_name }}"
          $isTag = $ref -like "refs/tags/v*"
          $isMainPush = ($event -eq "push" -and $ref -eq "refs/heads/main")

          $current = Get-Content "src/AssemblyInfo.cs" -Raw
          $m = [regex]::Match($current, 'AssemblyInformationalVersion\("([^"]+)"\)')
          $base = if ($m.Success) { $m.Groups[1].Value } else { "0.0.0" }

          if ($isTag) {
            $version = "${{ github.ref_name }}".Substring(1)
          } elseif ($isMainPush) {
            # Every push to main publishes the next patch release: bump the newest v* tag.
            $tags = @(git tag -l "v*") |
              Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
              ForEach-Object { [version]$_.Substring(1) } |
              Sort-Object
            if ($tags.Count -gt 0) {
              $last = $tags[-1]
              $version = "{0}.{1}.{2}" -f $last.Major, $last.Minor, ($last.Build + 1)
            } else {
              $version = $base
            }
          } else {
            # Pull request / manual build: readable and traceable, but not released.
            $version = "$base-dev.$($env:GITHUB_SHA.Substring(0, 7))"
          }
          $release = ($isTag -or $isMainPush).ToString().ToLowerInvariant()

          $numeric = $version.Split("-")[0]
          $parts = @($numeric.Split(".")) + @("0", "0", "0", "0")
          $asm = ($parts[0..3] -join ".")

          $path = "src/AssemblyInfo.cs"
          $text = Get-Content $path -Raw
          $text = $text -replace 'AssemblyVersion\("[^"]+"\)', "AssemblyVersion(`"$asm`")"
          $text = $text -replace 'AssemblyFileVersion\("[^"]+"\)', "AssemblyFileVersion(`"$asm`")"
          $text = $text -replace 'AssemblyInformationalVersion\("[^"]+"\)', "AssemblyInformationalVersion(`"$version`")"
          Set-Content -Path $path -Value $text -NoNewline

          "version=$version" >> $env:GITHUB_OUTPUT
          "assembly=$asm" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT
          Write-Host "packaging version $version (assembly $asm, release $release)"

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Verify exe
        shell: pwsh
        run: |
          $exe = Get-Item pi-web-tray.exe
          if ($exe.Length -lt 20000) { throw "pi-web-tray.exe looks too small: $($exe.Length) bytes" }
          $info = $exe.VersionInfo
          Write-Host "file: $($exe.Name) $($exe.Length) bytes"
          Write-Host "version: $($info.FileVersion) / $($info.ProductVersion)"

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $name = "pi-web-tray-$v-win-x64"
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item pi-web-tray.exe, README.md, LICENSE -Destination dist
          Compress-Archive -Path dist/* -DestinationPath "$name.zip"
          $hash = (Get-FileHash pi-web-tray.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  pi-web-tray.exe" | Set-Content "$name.sha256"
          "package=$name" >> $env:GITHUB_OUTPUT
        id: package

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-web-tray-${{ steps.version.outputs.version }}
          path: |
            pi-web-tray.exe
            *.zip
            *.sha256

      - name: Publish release
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $existing = gh release view $tag --json tagName --jq .tagName 2>$null
          if ($existing) {
            Write-Host "release $tag already exists; skipping"
            exit 0
          }

          # Push builds create the tag for the current commit; a v* tag push already has it.
          $target = @()
          if ("${{ github.ref }}" -notlike "refs/tags/*") {
            $target = @("--target", "${{ github.sha }}")
          }

          $zip = (Get-ChildItem *.zip).FullName
          $sha = (Get-ChildItem *.sha256).FullName
          gh release create $tag `
            --title "pi-web-tray $tag" `
            --generate-notes `
            @target `
            pi-web-tray.exe $zip $sha
